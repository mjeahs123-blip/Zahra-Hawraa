<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>عيد ميلاد جود 🎀</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff7f8;
            color: #5b454b;
            text-align: center;
        }

        .hero {
            min-height: 100vh;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .balloons {
            font-size: 45px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 48px;
            margin: 10px 0;
            color: #c77b8a;
        }

        h2 {
            font-size: 24px;
            font-weight: normal;
            margin: 10px 0 30px;
        }

        .details {
            background: white;
            padding: 25px;
            border-radius: 25px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .detail {
            margin: 15px 0;
            font-size: 18px;
        }

        .rsvp {
            background: #c77b8a;
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
        }

        .rsvp:hover {
            opacity: 0.85;
        }

        .form-container {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 25px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-top: 20px;
        }

        .form-container h3 {
            color: #c77b8a;
            font-size: 25px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px;
            margin: 8px 0 15px;
            border: 1px solid #eadadd;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
        }

        label {
            display: block;
            text-align: right;
            margin-top: 10px;
        }

        .submit {
            width: 100%;
            padding: 14px;
            background: #c77b8a;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 17px;
            cursor: pointer;
        }

        #success {
            display: none;
            margin-top: 20px;
            font-size: 18px;
            color: #7b5961;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 38px;
            }

            h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <section class="hero">

        <div class="balloons">
            🎈 🎀 🎈
        </div>

        <h2>يسعدنا حضوركم ومشاركتنا فرحتنا</h2>

        <h1>عيد ميلاد جود 🎂</h1>

        <div class="details">

            <div class="detail">
                📅 <strong>التاريخ:</strong><br>
                الجمعة 21 أغسطس
            </div>

            <div class="detail">
                🕖 <strong>الوقت:</strong><br>
                7:00 مساءً
            </div>

            <div class="detail">
                📍 <strong>المكان:</strong><br>
                اكتبوا المكان هنا
            </div>

        </div>

        <button class="rsvp" onclick="showForm()">
            تأكيد الحضور 💕
        </button>


        <div class="form-container" id="form">

            <h3>تأكيد الحضور 💌</h3>

            <form onsubmit="submitForm(event)">

                <label>الاسم</label>
                <input type="text" id="name" required>

                <label>هل ستتمكن من الحضور؟</label>

                <select id="attendance" required>
                    <option value="">اختاري</option>
                    <option value="نعم">نعم، سأحضر 🎉</option>
                    <option value="لا">للأسف لن أتمكن من الحضور</option>
                </select>

                <label>عدد الأشخاص</label>
                <input type="number" id="guests" min="0" value="1">

                <label>أسماء الأطفال</label>
                <textarea id="children" rows="3"></textarea>

                <button class="submit" type="submit">
                    تأكيد الحضور 💕
                </button>

            </form>

            <div id="success">
                🎉 تم تسجيل ردك بنجاح!<br>
                شكرًا لمشاركتنا فرحتنا 💕
            </div>

        </div>

    </section>


    <script>

        function showForm() {
            document.getElementById("form").style.display = "block";

            document.getElementById("form").scrollIntoView({
                behavior: "smooth"
            });
        }


        async function submitForm(event) {

    event.preventDefault();

    const name = document.getElementById("name").value;
    const attendance = document.getElementById("attendance").value;
    const guests = document.getElementById("guests").value;
    const children = document.getElementById("children").value;

    const data = {
        name: name,
        attendance: attendance,
        guests: guests,
        children: children
    };

    const scriptURL = "https://script.google.com/macros/s/AKfycbwVqCQjaOCWDQF6z0lmI5nJY8xIjW0Z6AjiwvigJyZaL51Z6Omvg4g9FtRWh6IWggx-/exec";

    try {

        await fetch(scriptURL, {
            method: "POST",
            body: JSON.stringify(data)
        });

        document.querySelector("#form form").style.display = "none";

        document.getElementById("success").style.display = "block";

    } catch (error) {

        alert("صار خطأ، حاولي مرة ثانية.");

        console.error(error);

    }
}

    </script>

</body>
</html>
