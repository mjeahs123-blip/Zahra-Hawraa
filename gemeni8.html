<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - Birthday Celebration</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Tajawal:wght@400;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-stripe: #d2c4b0;
            --bg-light: #fdfbf7;
            --brown-dark: #5c4033;
            --brown-accent: #8b5a2b;
            --card-shadow: rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Quicksand', 'Tajawal', sans-serif;
            background-color: #f7f4ee;
            color: var(--brown-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--bg-light);
            width: 100%;
            max-width: 460px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px var(--card-shadow);
            border: 2px solid #e8e0d5;
            text-align: center;
            position: relative;
        }

        /* Language Switcher Button */
        .lang-switch-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid var(--brown-accent);
            color: var(--brown-dark);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            z-index: 10;
            transition: 0.3s;
            backdrop-filter: blur(4px);
        }

        html[dir="rtl"] .lang-switch-btn {
            right: auto;
            left: 15px;
        }

        .lang-switch-btn:hover {
            background-color: var(--brown-accent);
            color: #fff;
        }

        /* Header Area with Stripes */
        .header-container {
            background: repeating-linear-gradient(
                90deg,
                #fdfbf7,
                #fdfbf7 18px,
                var(--bg-stripe) 18px,
                var(--bg-stripe) 36px
            );
            padding: 45px 20px 30px 20px;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            border-bottom: 3px solid #c2b29d;
        }

        .subtitle {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--brown-accent);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .title-eng {
            font-family: 'Fredoka', cursive;
            font-size: 2.4rem;
            color: var(--brown-dark);
            line-height: 1.2;
        }

        /* Content Area */
        .content {
            padding: 25px 25px 30px 25px;
        }

        .guest-greeting {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--brown-dark);
            margin-bottom: 15px;
            background-color: #f2e9dc;
            padding: 8px 18px;
            border-radius: 14px;
            display: inline-block;
        }

        .event-details {
            margin: 15px 0 20px 0;
            background-color: #f7f2ea;
            padding: 16px;
            border-radius: 16px;
            border: 1px dashed var(--bg-stripe);
        }

        .event-details p {
            font-size: 0.95rem;
            margin: 6px 0;
            color: #4a3728;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        html[dir="rtl"] .form-group {
            text-align: right;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--brown-dark);
        }

        .radio-group {
            display: flex;
            gap: 12px;
        }

        .radio-option {
            flex: 1;
            border: 1.5px solid #dcd1c4;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            background: #fff;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        .radio-option input {
            display: none;
        }

        .radio-option.active {
            background-color: var(--brown-accent);
            color: #fff;
            border-color: var(--brown-accent);
        }

        /* Dress Code Conditional Box */
        .dress-code-container {
            margin-top: 15px;
            background-color: #fdf8f0;
            border: 2px dashed var(--brown-accent);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .dress-code-text {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--brown-dark);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .dress-code-img {
            max-width: 130px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--brown-dark);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--brown-accent);
        }

        .btn-submit:disabled {
            background-color: #a89f91;
            cursor: not-allowed;
        }

        .success-message {
            display: none;
            padding: 20px;
            background-color: #e8f5e9;
            color: #2e7d32;
            border-radius: 12px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <button class="lang-switch-btn" onclick="toggleLanguage()" id="langBtn">العربية</button>

    <!-- Header Section -->
    <div class="header-container">
        <div class="subtitle" data-en="PLEASE JOIN US IN CELEBRATING THE BIRTHDAY OF" data-ar="يسرنا دعوتكم للاحتفال بعيد ميلاد">PLEASE JOIN US IN CELEBRATING THE BIRTHDAY OF</div>
        <h1 class="title-eng">Zahraa & Hawraa</h1>
    </div>

    <div class="content">
        <!-- Greeting from URL Name -->
        <div class="guest-greeting" id="greetingBox">
            <span id="welcomePrefix">Dear</span> <span id="guestName">Guest</span>,
        </div>

        <div class="event-details">
            <p><strong><span data-en="Date:" data-ar="التاريخ:">Date:</span></strong> 28 August 2026</p>
            <p><strong><span data-en="Time:" data-ar="الوقت:">Time:</span></strong> <span data-en="8 o'clock in the evening" data-ar="8:00 مساءً">8 o'clock in the evening</span></p>
            <p><strong><span data-en="Location:" data-ar="المكان:">Location:</span></strong> Jaafar Sanad House</p>
        </div>

        <div id="form">
            <form id="rsvpForm" onsubmit="submitForm(event)">
                <div class="form-group">
                    <label data-en="Will you attend?" data-ar="هل ستتمكن من الحضور؟">Will you attend?</label>
                    <div class="radio-group">
                        <label class="radio-option active" id="opt-yes" onclick="selectAttendance(true)">
                            <input type="radio" name="attendance" id="att-yes" value="Yes" checked> <span data-en="Yes, I'll be there ✨" data-ar="نعم، سأحضر ✨">Yes, I'll be there ✨</span>
                        </label>
                        <label class="radio-option" id="opt-no" onclick="selectAttendance(false)">
                            <input type="radio" name="attendance" id="att-no" value="No"> <span data-en="Sorry, I can't 🤍" data-ar="أعتذر عن الحضور 🤍">Sorry, I can't 🤍</span>
                        </label>
                    </div>
                </div>

                <!-- Conditional Box for Dress Code -->
                <div class="dress-code-container" id="dressCodeBox">
                    <div class="dress-code-text" data-en="We would be so happy if you wear this outfit! 👕" data-ar="سنكون سعداء جداً لو ارتديتم هذه الملابس! 👕">
                        We would be so happy if you wear this outfit! 👕
                    </div>
                    <!-- صورة الملابس (تتغير تلقائياً حسب الجنس) -->
                    <img id="outfitImg" src="ChatGPT_Image_Aug_27__2026__08_22_06_AM-removebg-preview.png" alt="Dress Code Outfit" class="dress-code-img">
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit" data-en="Confirm" data-ar="تأكيد">Confirm</button>
            </form>
        </div>

        <div id="success" class="success-message" data-en="Thank you! Your RSVP has been received 💕" data-ar="تم استلام تأكيدك بنجاح! ننتظرك بكل حب 💕">
            Thank you! Your RSVP has been received 💕
        </div>
    </div>
</div>

<script>
    let currentLang = 'en';
    let rawGuestName = 'Guest';
    let selectedAttendance = 'Yes';

    // Extract Name and Gender parameters from URL on load
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        
        // Name
        const nameParam = urlParams.get('name');
        if (nameParam && nameParam.trim() !== '') {
            rawGuestName = decodeURIComponent(nameParam.trim());
        }

        // Gender
        const genderParam = urlParams.get('gender');
        const outfitImg = document.getElementById('outfitImg');
        
        if (genderParam && genderParam.toLowerCase() === 'boy') {
            // صورة بدلة الولد
            outfitImg.src = 'ChatGPT_Image_Aug_27__2026__08_36_22_AM-removebg-preview.png';
        } else {
            // صورة بدلة البنت الوردي (افتراضي)
            outfitImg.src = 'ChatGPT_Image_Aug_27__2026__08_22_06_AM-removebg-preview.png';
        }

        updateGreeting();
    });

    function showForm() {
        document.getElementById("form").style.display = "block";
        document.getElementById("form").scrollIntoView({
            behavior: "smooth"
        });
    }

    function updateGreeting() {
        const prefix = document.getElementById('welcomePrefix');
        const nameSpan = document.getElementById('guestName');
        nameSpan.textContent = rawGuestName;

        if (currentLang === 'en') {
            prefix.textContent = 'Dear';
        } else {
            prefix.textContent = 'أهلاً بك';
        }
    }

    function toggleLanguage() {
        const html = document.documentElement;
        const langBtn = document.getElementById('langBtn');
        const elements = document.querySelectorAll('[data-en]');

        if (currentLang === 'en') {
            currentLang = 'ar';
            html.setAttribute('lang', 'ar');
            html.setAttribute('dir', 'rtl');
            langBtn.textContent = 'English';
        } else {
            currentLang = 'en';
            html.setAttribute('lang', 'en');
            html.setAttribute('dir', 'ltr');
            langBtn.textContent = 'العربية';
        }

        updateGreeting();

        elements.forEach(el => {
            el.textContent = el.getAttribute(`data-${currentLang}`);
        });
    }

    function selectAttendance(willAttend) {
        const yesOpt = document.getElementById('opt-yes');
        const noOpt = document.getElementById('opt-no');
        const dressCodeBox = document.getElementById('dressCodeBox');

        if (willAttend) {
            yesOpt.classList.add('active');
            noOpt.classList.remove('active');
            dressCodeBox.style.display = 'block';
            selectedAttendance = 'Yes';
        } else {
            noOpt.classList.add('active');
            yesOpt.classList.remove('active');
            dressCodeBox.style.display = 'none';
            selectedAttendance = 'No';
        }
    }

    async function submitForm(event) {
        event.preventDefault();

        const submitBtn = document.getElementById("btnSubmit");
        submitBtn.disabled = true;

        const data = {
            name: rawGuestName,
            attendance: selectedAttendance
        };

        const scriptURL = "https://script.google.com/macros/s/AKfycbwVqCQjaOCWDQF6z0lmI5nJY8xIjW0Z6AjiwvigJyZaL51Z6Omvg4g9FtRWh6IWggx-/exec";

        try {
            await fetch(scriptURL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            document.querySelector("#form form").style.display = "none";
            document.getElementById("success").style.display = "block";

        } catch (error) {
            alert(currentLang === 'ar' ? "صار خطأ، حاولي مرة ثانية." : "An error occurred, please try again.");
            console.error(error);
            submitBtn.disabled = false;
        }
    }
</script>

</body>
</html>
